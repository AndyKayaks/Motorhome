<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<link rel="apple-touch-icon" href="motorhome-icon.png">
<link rel="icon" type="image/png" href="motorhome-icon.png">

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Motorhome Monitor">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="theme-color" content="#07101d">

<title>Motorhome Monitor</title>

<style>
:root{
  color-scheme:dark;
  --bg:#08111d;
  --panel:#131d29;
  --panel2:#182330;
  --text:#ffffff;
  --secondary:#aeb9c9;
  --muted:#7d8998;
  --border:#243243;
  --ok:#31d77a;
  --warn:#ffd166;
  --bad:#ff7b7b;
  --frost:#66b7ff;
  --temp-cold:#69bfff;
  --temp-mid:#7890a6;
  --temp-warm:#ff7b5f;
  --shadow:rgba(0,0,0,.35);
}

*{
  box-sizing:border-box;
}

html,
body{
  min-height:100%;
}

body{
  margin:0;
  padding:
    calc(16px + env(safe-area-inset-top))
    16px
    calc(28px + env(safe-area-inset-bottom));
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    Arial,
    sans-serif;
  background:
    radial-gradient(circle at top,rgba(30,58,85,.22),transparent 35%),
    var(--bg);
  color:var(--text);
}

.wrap{
  max-width:430px;
  margin:auto;
}

h1{
  text-align:center;
  font-size:31px;
  line-height:1.1;
  margin:10px 0 6px;
  letter-spacing:-.02em;
}

.remote{
  text-align:center;
  font-size:13px;
  letter-spacing:.22em;
  text-transform:uppercase;
  color:var(--secondary);
  margin-bottom:22px;
}

/* REMOTE STATUS */

.statusCard{
  background:var(--panel);
  border:1px solid var(--border);
  border-radius:22px;
  padding:20px 18px;
  margin-bottom:18px;
  box-shadow:0 8px 26px var(--shadow);
  text-align:left;
}

.statusTop{
  display:flex;
  align-items:center;
  gap:12px;
  font-size:18px;
  font-weight:650;
}

.statusDot{
  width:12px;
  height:12px;
  border-radius:50%;
  background:var(--muted);
  flex:0 0 auto;
}

.statusCard.ok .statusDot{
  background:var(--ok);
  box-shadow:0 0 12px rgba(49,215,122,.45);
}

.statusCard.warn .statusDot{
  background:var(--warn);
}

.statusCard.bad .statusDot{
  background:var(--bad);
}

.statusSub{
  color:var(--secondary);
  font-size:14px;
  margin-top:8px;
  margin-left:24px;
  line-height:1.45;
}

/* LOCAL DASHBOARD LINK */

.local-link{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:10px;
  width:100%;
  text-decoration:none;
  border:1px solid var(--border);
  border-radius:18px;
  background:linear-gradient(180deg,#263c54,#213348);
  color:#fff;
  padding:15px 18px;
  font-size:17px;
  font-weight:650;
  margin-bottom:18px;
  box-shadow:0 5px 16px var(--shadow);
}

.local-link:active{
  transform:scale(.985);
}

.local-link svg{
  width:23px;
  height:23px;
  stroke:currentColor;
  fill:none;
  stroke-width:2;
  stroke-linecap:round;
  stroke-linejoin:round;
}

/* STATUS ICONS */

.statusIcons{
  display:flex;
  justify-content:center;
  gap:16px;
  margin:2px 0 20px;
}

.statusIcon{
  width:64px;
  height:64px;
  border-radius:18px;
  display:flex;
  align-items:center;
  justify-content:center;
  box-shadow:0 7px 18px var(--shadow);
  border:1px solid var(--border);
}

.statusIcon svg{
  width:34px;
  height:34px;
  fill:none;
  stroke:currentColor;
  stroke-width:2;
  stroke-linecap:round;
  stroke-linejoin:round;
}

.inverterIcon{
  background:#303946;
  color:#8e9bab;
}

.inverterIcon.on{
  background:linear-gradient(180deg,#1fb45b,#168b45);
  color:#fff;
  border-color:#24b862;
  box-shadow:
    0 7px 18px rgba(0,0,0,.28),
    0 0 20px rgba(31,180,91,.22);
}

.frostIcon{
  display:none;
  background:var(--panel);
  color:var(--frost);
}

.frostIcon.show{
  display:flex;
}

/* TEMPERATURE CARDS */

.tempGrid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
  margin:0 0 12px;
}

.tempGrid.single{
  grid-template-columns:1fr;
}

.tempCard{
  display:grid;
  grid-template-columns:38px 1fr 20px;
  align-items:center;
  gap:10px;
  background:var(--panel);
  border:1px solid var(--border);
  border-radius:20px;
  padding:18px 16px;
  margin:0 0 14px;
  box-shadow:0 8px 26px var(--shadow);
  text-decoration:none;
  color:var(--text);
}

.tempCard.compact{
  grid-template-columns:30px 1fr;
  gap:8px;
  min-width:0;
  padding:15px 12px;
  margin:0;
  border-radius:18px;
}

.tempCard.compact .chevron{
  display:none;
}

.tempCard.compact .tempIcon svg{
  width:24px;
  height:24px;
}

.tempCard.compact .tempLabel{
  font-size:14px;
  margin-bottom:3px;
}

.tempCard.compact .tempValue{
  font-size:28px;
}

.tempIcon{
  display:flex;
  align-items:center;
  justify-content:center;
  transition:color .25s ease;
}

.tempIcon svg{
  width:28px;
  height:28px;
  fill:none;
  stroke:currentColor;
  stroke-width:2;
  stroke-linecap:round;
  stroke-linejoin:round;
}

.tempIcon.cold{
  color:var(--temp-cold);
}

.tempIcon.mid{
  color:var(--temp-mid);
}

.tempIcon.warm{
  color:var(--temp-warm);
}

.tempText{
  min-width:0;
}

.tempLabel{
  color:var(--secondary);
  font-size:16px;
  margin-bottom:4px;
}

.tempValue{
  color:var(--text);
  font-size:34px;
  line-height:1;
  font-weight:760;
  letter-spacing:-.035em;
}

.chevron{
  color:var(--muted);
  display:flex;
  align-items:center;
  justify-content:flex-end;
}

.chevron svg{
  width:20px;
  height:20px;
  fill:none;
  stroke:currentColor;
  stroke-width:2;
  stroke-linecap:round;
  stroke-linejoin:round;
}

/* BUTTON */

button{
  width:100%;
  border:1px solid var(--border);
  border-radius:18px;
  background:linear-gradient(180deg,#345675,#2b4864);
  color:#fff;
  padding:15px 18px;
  font:inherit;
  font-size:17px;
  font-weight:650;
  margin-top:4px;
  cursor:pointer;
  box-shadow:0 5px 16px var(--shadow);
}

button:active{
  transform:scale(.985);
}

.refreshInner{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:10px;
}

.refreshInner svg{
  width:23px;
  height:23px;
  fill:none;
  stroke:currentColor;
  stroke-width:2;
  stroke-linecap:round;
  stroke-linejoin:round;
}

.footer{
  text-align:center;
  font-size:12px;
  color:var(--secondary);
  line-height:1.55;
  margin-top:24px;
}

.errorBox{
  display:none;
  background:var(--panel);
  border:1px solid var(--border);
  border-radius:14px;
  padding:14px;
  margin:0 0 16px;
  color:var(--bad);
  font-size:13px;
}

/* SPLASH */

#splash{
  position:fixed;
  z-index:9999;
  inset:0;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:
    calc(20px + env(safe-area-inset-top))
    24px
    calc(20px + env(safe-area-inset-bottom));
  background:#07101d;
  opacity:1;
  visibility:visible;
  transition:opacity .65s ease,visibility .65s ease;
}

#splash.hide{
  opacity:0;
  visibility:hidden;
  pointer-events:none;
}

.splash-inner{
  width:min(84vw,360px);
  display:flex;
  flex-direction:column;
  align-items:center;
}

.splash-icon{
  width:min(76vw,300px);
  height:auto;
  display:block;
  border-radius:22%;
  box-shadow:0 18px 45px rgba(0,0,0,.42);
  animation:splashIn .7s ease both;
}

.splash-title{
  margin-top:22px;
  color:#fff;
  font-size:21px;
  font-weight:750;
  letter-spacing:.08em;
  text-transform:uppercase;
}

.splash-status{
  margin-top:10px;
  color:#aeb9c9;
  font-size:14px;
}

.splash-dot{
  display:inline-block;
  width:7px;
  height:7px;
  margin-left:5px;
  border-radius:50%;
  background:#8fd19e;
  animation:pulse 1.1s infinite ease-in-out;
}

@keyframes splashIn{
  from{
    opacity:0;
    transform:translateY(8px) scale(.97);
  }
  to{
    opacity:1;
    transform:translateY(0) scale(1);
  }
}

@keyframes pulse{
  0%,100%{opacity:.3}
  50%{opacity:1}
}

@media (prefers-reduced-motion:reduce){
  #splash{transition:none}
  .splash-icon,
  .splash-title,
  .splash-status,
  .splash-dot{
    animation:none;
  }
}
</style>
</head>

<body>

<div id="splash" aria-hidden="true">
  <div class="splash-inner">
    <img class="splash-icon" src="motorhome-icon.png" alt="">
    <div class="splash-title">Motorhome Monitor</div>
    <div class="splash-status">
      Connecting<span class="splash-dot"></span>
    </div>
  </div>
</div>

<main class="wrap">

  <h1>Motorhome Monitor</h1>
  <div class="remote">Remote</div>

  <section class="statusCard" id="statusCard">
    <div class="statusTop">
      <span class="statusDot"></span>
      <span id="statusTitle">Connecting to Motorhome data…</span>
    </div>

    <div class="statusSub" id="statusSub">
      Waiting for latest update
    </div>
  </section>

  <div class="errorBox" id="errorBox"></div>

  <a
    class="local-link"
    href="http://motorhome.local/"
  >
    <svg viewBox="0 0 24 24" aria-hidden="true">
      <path d="M3 11.5L12 4l9 7.5"></path>
      <path d="M5.5 10.5V20h13v-9.5"></path>
      <path d="M9.5 20v-5h5v5"></path>
    </svg>
    Local Dashboard
  </a>

  <div class="statusIcons">

    <div
      class="statusIcon inverterIcon"
      id="inverterIcon"
      title="Inverter supply OFF"
    >
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <rect x="3" y="5" width="18" height="14" rx="2"></rect>
        <path d="M6.5 12c1.2-2.2 2.4-2.2 3.6 0s2.4 2.2 3.6 0 2.4-2.2 3.8 0"></path>
      </svg>
    </div>

    <div
      class="statusIcon frostIcon"
      id="frostIcon"
      title="Frost warning"
    >
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M12 2v20"></path>
        <path d="M4.22 6.5l15.56 11"></path>
        <path d="M19.78 6.5l-15.56 11"></path>
        <path d="M9 4l3 3 3-3"></path>
        <path d="M9 20l3-3 3 3"></path>
        <path d="M5.5 8.3l4.1.8-.8-4"></path>
        <path d="M18.5 15.7l-4.1-.8.8 4"></path>
        <path d="M18.5 8.3l-4.1.8.8-4"></path>
        <path d="M5.5 15.7l4.1-.8-.8 4"></path>
      </svg>
    </div>

  </div>

  <div class="tempGrid" id="insideTempGrid">

    <div class="tempCard compact" id="frontCard">
      <div class="tempIcon" id="frontIcon">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M10 14.5V5a2 2 0 1 1 4 0v9.5"></path>
          <circle cx="12" cy="17" r="4"></circle>
          <path d="M12 8v9"></path>
        </svg>
      </div>

      <div class="tempText">
        <div class="tempLabel" id="frontLabel">Front</div>
        <div class="tempValue" id="front">--.- °C</div>
      </div>

      <div class="chevron" id="frontChevron">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M9 5l7 7-7 7"></path>
        </svg>
      </div>
    </div>

    <div class="tempCard compact" id="backCard">
      <div class="tempIcon" id="backIcon">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M10 14.5V5a2 2 0 1 1 4 0v9.5"></path>
          <circle cx="12" cy="17" r="4"></circle>
          <path d="M12 8v9"></path>
        </svg>
      </div>

      <div class="tempText">
        <div class="tempLabel">Back</div>
        <div class="tempValue" id="back">--.- °C</div>
      </div>
    </div>

  </div>

  <div class="tempCard">
    <div class="tempIcon" id="outsideIcon">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M10 14.5V5a2 2 0 1 1 4 0v9.5"></path>
        <circle cx="12" cy="17" r="4"></circle>
        <path d="M12 8v9"></path>
      </svg>
    </div>

    <div class="tempText">
      <div class="tempLabel">Outside</div>
      <div class="tempValue" id="outside">--.- °C</div>
    </div>

    <div class="chevron">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M9 5l7 7-7 7"></path>
      </svg>
    </div>
  </div>

  <button type="button" id="refresh">
    <span class="refreshInner">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M20 11a8 8 0 1 0-2.3 5.7"></path>
        <path d="M20 4v7h-7"></path>
      </svg>
      Refresh now
    </span>
  </button>

  <div class="footer">
    ThingSpeak channel 3479295<br>
    Dashboard refreshes automatically every 60 seconds
  </div>

</main>

<script>
const CHANNEL_ID = 3479295;

const API =
  `https://api.thingspeak.com/channels/${CHANNEL_ID}/feeds.json?results=1`;

const REFRESH_MS = 60000;
const STALE_WARN_MINUTES = 3;
const OFFLINE_MINUTES = 10;
const FROST_WARNING_TEMP_C = 3.0;

const SPLASH_MIN_MS = 2200;
const SPLASH_MAX_MS = 6000;

const splashStarted = Date.now();
let splashClosed = false;

const $ = id =>
  document.getElementById(id);

function numericValue(value){
  if(
    value === null ||
    value === undefined ||
    value === ""
  ){
    return NaN;
  }

  const n =
    Number.parseFloat(value);

  return Number.isFinite(n)
    ? n
    : NaN;
}

function temp(value){
  const n =
    numericValue(value);

  return Number.isFinite(n)
    ? `${n.toFixed(1)} °C`
    : "--.- °C";
}

function temperatureClass(value){
  const n =
    numericValue(value);

  if(!Number.isFinite(n)){
    return "mid";
  }

  if(n < 9){
    return "cold";
  }

  if(n < 18){
    return "mid";
  }

  return "warm";
}

function setTemperatureIcon(iconId,value){
  const el = $(iconId);

  el.classList.remove(
    "cold",
    "mid",
    "warm"
  );

  el.classList.add(
    temperatureClass(value)
  );
}

function setRearAvailability(value){
  const rearAvailable =
    Number.isFinite(
      numericValue(value)
    );

  const grid =
    $("insideTempGrid");

  const frontCard =
    $("frontCard");

  const backCard =
    $("backCard");

  const frontLabel =
    $("frontLabel");

  const frontChevron =
    $("frontChevron");

  if(rearAvailable){
    grid.classList.remove("single");

    frontCard.classList.add("compact");

    backCard.style.display = "";

    frontLabel.textContent =
      "Front";

    frontChevron.style.display =
      "none";
  }
  else{
    grid.classList.add("single");

    frontCard.classList.remove("compact");

    backCard.style.display =
      "none";

    frontLabel.textContent =
      "Motorhome";

    frontChevron.style.display =
      "";
  }

  return rearAvailable;
}

function setInverter(value){
  const el =
    $("inverterIcon");

  const n =
    Number.parseInt(value,10);

  el.classList.remove("on");

  if(n === 1){
    el.classList.add("on");
    el.title =
      "Inverter supply ON";
  }
  else{
    el.title =
      "Inverter supply OFF";
  }
}

function setFrostWarning(value){
  const el =
    $("frostIcon");

  const temperature =
    numericValue(value);

  if(
    Number.isFinite(temperature) &&
    temperature <=
      FROST_WARNING_TEMP_C
  ){
    el.classList.add("show");

    el.title =
      `Outside temperature ${temperature.toFixed(1)}°C`;
  }
  else{
    el.classList.remove("show");
  }
}

function ageText(ms){
  const seconds =
    Math.max(
      0,
      Math.floor(ms/1000)
    );

  if(seconds < 60){
    return `${seconds} sec ago`;
  }

  const minutes =
    Math.floor(seconds/60);

  if(minutes < 60){
    return `${minutes} min ago`;
  }

  const hours =
    Math.floor(minutes/60);

  const remainderMinutes =
    minutes % 60;

  if(hours < 24){
    return remainderMinutes
      ? `${hours} hr ${remainderMinutes} min ago`
      : `${hours} hr ago`;
  }

  const days =
    Math.floor(hours/24);

  return `${days} day${days===1?"":"s"} ago`;
}

function setStatus(createdAt){
  const card =
    $("statusCard");

  const title =
    $("statusTitle");

  const sub =
    $("statusSub");

  const t =
    new Date(createdAt);

  const age =
    Date.now() -
    t.getTime();

  const mins =
    age / 60000;

  const clock =
    t.toLocaleTimeString(
      [],
      {
        hour:"2-digit",
        minute:"2-digit",
        second:"2-digit"
      }
    );

  const date =
    t.toLocaleDateString(
      [],
      {
        weekday:"short",
        day:"numeric",
        month:"short"
      }
    );

  card.className =
    "statusCard";

  if(mins >= OFFLINE_MINUTES){
    card.classList.add("bad");

    title.textContent =
      "Motorhome may be offline";

    sub.textContent =
      `Last update ${ageText(age)} · ${date} ${clock}`;
  }
  else if(mins >= STALE_WARN_MINUTES){
    card.classList.add("warn");

    title.textContent =
      "Update delayed";

    sub.textContent =
      `Last update ${ageText(age)} · ${clock}`;
  }
  else{
    card.classList.add("ok");

    title.textContent =
      "Motorhome online";

    sub.textContent =
      `Updated ${ageText(age)} · ${clock}`;
  }
}

function closeSplash(){
  if(splashClosed){
    return;
  }

  splashClosed = true;

  $("splash")
    .classList
    .add("hide");

  window.setTimeout(
    ()=>{
      const splash =
        $("splash");

      if(splash){
        splash.remove();
      }
    },
    800
  );
}

function closeSplashWhenReady(){
  const elapsed =
    Date.now() -
    splashStarted;

  const remaining =
    Math.max(
      0,
      SPLASH_MIN_MS - elapsed
    );

  window.setTimeout(
    closeSplash,
    remaining
  );
}

window.setTimeout(
  closeSplash,
  SPLASH_MAX_MS
);

async function loadData(){
  const errorBox =
    $("errorBox");

  try{
    const response =
      await fetch(
        API,
        {cache:"no-store"}
      );

    if(!response.ok){
      throw new Error(
        `ThingSpeak returned HTTP ${response.status}`
      );
    }

    const data =
      await response.json();

    if(
      !data.feeds ||
      !data.feeds.length
    ){
      throw new Error(
        "No readings have been returned yet."
      );
    }

    const reading =
      data.feeds[
        data.feeds.length - 1
      ];

    // Field 1 = Front / Motorhome
    $("front").textContent =
      temp(reading.field1);

    setTemperatureIcon(
      "frontIcon",
      reading.field1
    );

    // Field 2 = Rear ESP32 temperature.
    // If the main ESP32 has no rear reading, the Back
    // card is hidden and Front becomes Motorhome/full width.
    const rearAvailable =
      setRearAvailability(
        reading.field2
      );

    if(rearAvailable){
      $("back").textContent =
        temp(reading.field2);

      setTemperatureIcon(
        "backIcon",
        reading.field2
      );
    }

    // Field 3 = Outside
    $("outside").textContent =
      temp(reading.field3);

    setTemperatureIcon(
      "outsideIcon",
      reading.field3
    );

    setFrostWarning(
      reading.field3
    );

    // Field 4 = Inverter
    setInverter(
      reading.field4
    );

    setStatus(
      reading.created_at
    );

    errorBox.style.display =
      "none";

    errorBox.textContent =
      "";
  }
  catch(err){
    const card =
      $("statusCard");

    card.className =
      "statusCard bad";

    $("statusTitle").textContent =
      "Unable to reach remote data";

    $("statusSub").textContent =
      "No current ThingSpeak response";

    errorBox.textContent =
      err.message;

    errorBox.style.display =
      "block";
  }
  finally{
    closeSplashWhenReady();
  }
}

$("refresh")
  .addEventListener(
    "click",
    loadData
  );

loadData();

setInterval(
  loadData,
  REFRESH_MS
);
</script>

</body>
</html>
